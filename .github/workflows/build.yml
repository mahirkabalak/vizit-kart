name: AAB derle

on:
  push:
    branches: [main]
    paths-ignore: ["*.html", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Release AAB (imzasız)
        run: gradle :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Sonucu build dalına yaz
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp app/build/outputs/bundle/release/*.aab out/vizit-kart-unsigned.aab 2>/dev/null || true
          echo "${GITHUB_SHA}" > out/commit.txt
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b build
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build
